  if(!article) return;
  const images = await dbGetArticleImages(articleId);
  if(article.blocks.length === 0){ showToast('这篇文章没有内容可导出'); return; }
  showToast('正在生成 Word...');
  const B = createDocxBuilder();
  const imgMap = {};
  for(const im of images) imgMap[im.id] = im.data;
  let body = dxPara(dxRun(article.title,{bold:true,size:26,color:'26C6DA'}),{align:'center'})
    + dxPara(dxRun(`导出时间：${new Date().toLocaleString()}`,{size:11,color:'999999'}),{align:'center'});
  for(let i=0; i<article.blocks.length; i++){
    const b = article.blocks[i];
    if(b.type === 'text' && b.content && b.content.trim()){
      const lines = b.content.split('\n');
      for(const line of lines){
        body += dxPara(dxRun(line,{size:18}),{align:'left'});
      }
    } else if(b.type === 'image' && imgMap[b.id]){
      if(i > 0) body += dxPara('');
      body += dxPara(await B.addImage(imgMap[b.id], 440, 540), {align:'center'});
    }
  }
  body += dxPara('');
  downloadBlob(await B.build(body), sanitizeFilename('文章_' + article.title) + '.docx');
  showToast('文章 Word 已导出！');
}

/* ========== Backup ========== */
async function exportBackup(){
  showToast('正在准备备份...');
  const images = await dbGetAllImages();
  const storyImages = await dbGetAllStoryImages();
  const articleImages = await dbGetAllArticleImages();
  const backup = {
    version: 1,
    exportDate: new Date().toISOString(),
    libraries: state.libraries,
    words: state.words,
    images: images,
    storyLibs: state.storyLibs,
    stories: state.stories,
    storyImages: storyImages,
    articleLibs: state.articleLibs,
    articles: state.articles,
    articleImages: articleImages
  };
  const json = JSON.stringify(backup);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `单词本备份_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('备份已导出！');
}
document.getElementById('backup-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup.libraries || !backup.words){
      showToast('备份文件格式不正确');
      return;
    }
    const ok = await showConfirm('导入备份将覆盖当前所有数据，确定继续吗？');
    if(!ok) return;
    // Restore data
    state.libraries = backup.libraries;
    state.words = backup.words;
    state.storyLibs = backup.storyLibs || [];
    state.stories = backup.stories || [];
    state.articleLibs = backup.articleLibs || [];
    state.articles = backup.articles || [];
    saveLibraries();
    saveWords();
    saveStoryLibs();
    saveStories();
    saveArticleLibs();
    saveArticles();
    // Restore images
    await dbClearAllImages();
    if(backup.images && backup.images.length){
      for(const img of backup.images){
        await dbSaveImage(img);
      }
    }
    await dbClearAllStoryImages();
    if(backup.storyImages && backup.storyImages.length){
      for(const img of backup.storyImages){
        await dbSaveStoryImage(img);
      }
    }
    await dbClearAllArticleImages();
    if(backup.articleImages && backup.articleImages.length){
      for(const img of backup.articleImages){
        await dbSaveArticleImage(img);
      }
    }
    showToast('备份导入成功！');
    navigateHome();
  }catch(err){
    showToast('导入失败：文件格式错误');
  }
});

/* ========== Navigation Helpers ========== */
function navigateHome(){
  state.currentLibraryId = null;
  state.currentGroupId = null;
  renderHome();
  showPage('page-home');
}
function refreshCurrentPage(){
  if(state.currentPage === 'page-home') renderHome();
  else if(state.currentPage === 'page-wordlib-home') renderWordLibHome();
  else if(state.currentPage === 'page-library') renderLibrary();
  else if(state.currentPage === 'page-group') renderGroup();
  else if(state.currentPage === 'page-all-words') renderAllWords();
  else if(state.currentPage === 'page-marked-words') renderMarkedWords();
  else if(state.currentPage === 'page-add-to-lib') renderAddToLib();
  else if(state.currentPage === 'page-review-select') renderReviewSelect();
  else if(state.currentPage === 'page-story-home') renderStoryHome();
  else if(state.currentPage === 'page-story-lib') renderStoryLib();
  else if(state.currentPage === 'page-story-group') renderStoryGroup();
  else if(state.currentPage === 'page-article-home') renderArticleHome();
  else if(state.currentPage === 'page-article-lib') renderArticleLib();
  else if(state.currentPage === 'page-article-group') renderArticleGroup();
  else navigateHome();
}

/* ========== Init ========== */
function init(){
  state.libraries = loadLibraries();
  state.words = loadWords();
  state.storyLibs = loadStoryLibs();
  state.stories = loadStories();
  state.articleLibs = loadArticleLibs();
  state.articles = loadArticles();
  try{ const f = parseInt(localStorage.getItem('wordbook_articleFont'), 10); if(!isNaN(f)) state.articleFontSize = f; }catch(e){}
  renderHome();
  showPage('page-home');
}
init();
</script>
