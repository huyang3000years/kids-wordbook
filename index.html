<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📚 小朋友英语单词本</title>
<style>
:root{
  --bg:#FFF9F0; --card:#FFFFFF; --primary:#6C5CE7; --primary-d:#5341C9; --primary-l:#A29BFE;
  --green:#6BCB77; --yellow:#FFD93D; --red:#FF7675; --blue:#74B9FF;
  --orange:#FFA07A; --text:#2D3436; --text-l:#636E72; --radius:16px;
  --shadow:0 4px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);font-size:18px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;max-width:680px;margin:0 auto;min-height:100vh;
}
.hidden{display:none!important}
.page{padding:16px;padding-bottom:80px}
/* Header */
.app-header{
  background:linear-gradient(135deg,var(--primary),var(--primary-l));
  color:#fff;padding:20px 16px;border-radius:0 0 var(--radius) var(--radius);
  text-align:center;margin-bottom:16px;
}
.app-header h1{font-size:28px;margin-bottom:4px}
.app-header p{font-size:16px;opacity:.9}
/* Warning */
.warning-box{
  background:#FFF3CD;border:2px solid #FFE08A;border-radius:var(--radius);
  padding:12px 16px;margin-bottom:16px;font-size:16px;color:#856404;text-align:center;
}
/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:14px 20px;font-size:20px;border:none;border-radius:14px;cursor:pointer;
  font-weight:600;min-height:52px;transition:transform .12s,box-shadow .12s;
  font-family:inherit;
}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--primary);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-purple{background:var(--primary);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-gray{background:#DDD;color:#555}
.btn-white{background:#fff;color:var(--text);border:2px solid #E0E0E0}
.btn-large{padding:18px 28px;font-size:22px;min-height:60px;width:100%}
.btn-small{padding:8px 14px;font-size:16px;min-height:40px;border-radius:10px}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:0}
/* Cards */
.card{
  background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px;
}
.card-title{font-size:22px;font-weight:700;margin-bottom:8px}
/* Library card */
.lib-card{
  background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;position:relative;
}
.lib-card.dragging{opacity:.45}
.lib-card.drag-over{box-shadow:0 0 0 3px var(--primary-l);border-color:var(--primary)}
.lib-card.hidden-lib{background:#F4F4F4;opacity:.55}
.lib-icon{font-size:40px}
.lib-info{flex:1;min-width:0}
.lib-name{font-size:22px;font-weight:700}
.lib-meta{font-size:14px;color:var(--text-l)}
/* Group card */
.group-card{
  background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;cursor:pointer;
}
.group-icon{font-size:32px}
.group-info{flex:1}
.group-name{font-size:20px;font-weight:600}
.group-meta{font-size:14px;color:var(--text-l)}
/* Word card */
.word-card{
  background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.word-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:6px;
}
.word-card.red::before{background:var(--red)}
.word-card.yellow::before{background:var(--yellow)}
.word-card.green::before{background:var(--green)}
.word-card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.word-thumb{
  width:70px;height:70px;border-radius:12px;background:#F0F0F0;
  display:flex;align-items:center;justify-content:center;font-size:32px;
  flex-shrink:0;overflow:hidden;cursor:pointer;
}
.word-thumb img{width:100%;height:100%;object-fit:cover}
.word-main{flex:1;min-width:0}
.word-english{font-size:26px;font-weight:700;color:var(--primary);cursor:pointer}
.word-english:hover{text-decoration:underline;color:var(--primary-d)}
.word-chinese{
  font-size:20px;color:var(--text-l);white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.word-card-actions{display:flex;gap:8px;margin-top:8px}
/* Label buttons */
.label-dot{
  width:40px;height:40px;border-radius:50%;border:3px solid #E0E0E0;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;transition:transform .12s;
}
.label-dot:active{transform:scale(.9)}
.label-dot.red{background:var(--red);border-color:var(--red)}
.label-dot.yellow{background:var(--yellow);border-color:var(--yellow)}
.label-dot.green{background:var(--green);border-color:var(--green)}
/* Form */
.form-group{margin-bottom:16px}
.form-label{font-size:20px;font-weight:600;margin-bottom:8px;display:block}
.form-input{
  width:100%;padding:14px 16px;font-size:20px;border:2px solid #E0E0E0;
  border-radius:12px;font-family:inherit;background:#fff;
}
.form-input:focus{outline:none;border-color:var(--primary)}
textarea.form-input{resize:vertical;min-height:60px}
/* Image upload */
.image-slots{display:flex;gap:10px;flex-wrap:wrap}
.image-slot{
  width:100px;height:100px;border-radius:12px;border:3px dashed #C0C0C0;
  display:flex;align-items:center;justify-content:center;font-size:36px;
  cursor:pointer;overflow:hidden;position:relative;background:#FAFAFA;
}
.image-slot img{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.image-slot.filled{border-style:solid;border-color:var(--green)}
.image-slot.draggable{cursor:grab}
.image-slot.draggable:active{cursor:grabbing}
.image-slot.dragging{opacity:.45}
.image-slot.drag-over{box-shadow:0 0 0 3px var(--primary-l);border-color:var(--primary)}
.image-slot .img-order{
  position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:12px;line-height:22px;
  text-align:center;z-index:2;font-weight:700;
}
.image-slot .remove-btn{
  position:absolute;top:2px;right:2px;width:28px;height:28px;
  background:rgba(255,0,0,.8);color:#fff;border:none;border-radius:50%;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
/* Label selector */
.label-selector{display:flex;gap:10px}
.label-option{
  flex:1;padding:14px;border-radius:14px;border:3px solid #E0E0E0;
  text-align:center;cursor:pointer;font-size:18px;font-weight:600;
  background:#fff;transition:all .15s;
}
.label-option.active{border-width:3px}
.label-option.red.active{background:var(--red);color:#fff;border-color:var(--red)}
.label-option.yellow.active{background:var(--yellow);color:#fff;border-color:var(--yellow)}
.label-option.green.active{background:var(--green);color:#fff;border-color:var(--green)}
/* Placement checkboxes */
.placement-section{
  border:1px solid #E0E0E0;border-radius:12px;margin-bottom:8px;overflow:hidden;
}
.placement-lib{
  padding:10px 14px;background:#F8F8F8;font-weight:700;font-size:18px;
  display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
}
.placement-groups{overflow:hidden}
.collapse-arrow{
  margin-left:auto;font-size:14px;color:var(--text-l);
  transition:transform .2s;display:inline-block;flex-shrink:0;
}
.collapse-arrow.open{transform:rotate(180deg)}
.form-label-toggle{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
}
.placement-group{
  padding:10px 14px 10px 28px;display:flex;align-items:center;gap:8px;
  border-top:1px solid #F0F0F0;cursor:pointer;font-size:18px;
}
.placement-group input{width:22px;height:22px;cursor:pointer}
.placement-group.checked{background:#F0FFF0}
/* Review */
.review-card{
  background:var(--card);border-radius:var(--radius);padding:24px 16px;
  box-shadow:var(--shadow);text-align:center;margin-bottom:16px;
}
.review-english{font-size:42px;font-weight:700;color:var(--primary);margin:12px 0}
.review-chinese{
  font-size:28px;color:var(--text-l);margin-bottom:16px;
  white-space:pre-wrap;word-break:break-word;
}
.review-images{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.review-img{
  width:120px;height:120px;border-radius:12px;object-fit:cover;cursor:pointer;
  box-shadow:var(--shadow);
}
.review-progress{
  text-align:center;font-size:20px;font-weight:600;color:var(--text-l);margin-bottom:12px;
}
.review-labels{display:flex;gap:10px;margin-bottom:16px}
.review-label-btn{
  flex:1;padding:16px;border-radius:14px;border:3px solid #E0E0E0;
  font-size:20px;font-weight:600;cursor:pointer;text-align:center;background:#fff;
}
/* Review faces */
.review-hint{font-size:20px;color:var(--text-l);margin-bottom:8px}
.review-faces{display:flex;gap:16px;margin-bottom:16px}
.review-face-btn{
  flex:1;min-height:140px;border-radius:20px;cursor:pointer;
  font-size:60px;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);transition:transform .12s;font-family:inherit;
}
.review-face-btn:active{transform:scale(.94)}
.review-face-btn.cry{background:#FFE9E9;border:4px solid var(--red)}
.review-face-btn.alone{flex:0 0 64%;margin:0 auto}
.review-lib-arrow{
  padding:8px 14px;font-size:18px;color:var(--primary);background:#F4F4F4;
  border-radius:10px;flex-shrink:0;transition:transform .2s;user-select:none;
}
.review-lib-arrow.open{transform:rotate(180deg)}
.review-label-btn.red.active{background:var(--red);color:#fff;border-color:var(--red)}
.review-label-btn.yellow.active{background:var(--yellow);color:#fff;border-color:var(--yellow)}
.review-label-btn.green.active{background:var(--green);color:#fff;border-color:var(--green)}
/* Review exclude-green toggle */
.review-toggle{
  display:flex;align-items:center;gap:8px;padding:12px 16px;margin-bottom:14px;
  background:var(--card);border:2px solid #E0E0E0;border-radius:14px;cursor:pointer;
  font-size:16px;font-weight:600;box-shadow:var(--shadow);
}
.review-toggle.on{border-color:var(--primary);background:#F0EBFF}
.review-toggle .rt-box{
  width:44px;height:26px;border-radius:13px;background:#ccc;position:relative;flex-shrink:0;transition:background .2s;
}
.review-toggle.on .rt-box{background:var(--primary)}
.review-toggle .rt-knob{
  position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;
}
.review-toggle.on .rt-knob{left:21px}
/* Image viewer */
.image-viewer{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.88);z-index:1000;justify-content:center;align-items:center;padding:20px;
}
.image-viewer.show{display:flex}
.image-viewer img{max-width:95%;max-height:90%;border-radius:12px}
.image-viewer .close-hint{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  color:#fff;font-size:16px;opacity:.7;
}
/* Modal */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:center;padding:20px;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:#fff;border-radius:var(--radius);padding:24px;max-width:400px;width:100%;
  text-align:center;
}
.modal-box p{font-size:20px;margin-bottom:20px}
.modal-input{
  width:100%;padding:14px;font-size:20px;border:2px solid #E0E0E0;
  border-radius:12px;margin-bottom:16px;font-family:inherit;
}
.modal-buttons{display:flex;gap:10px}
.modal-buttons .btn{flex:1}
/* Toast */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
  background:rgba(0,0,0,.82);color:#fff;padding:14px 28px;border-radius:14px;
  font-size:18px;z-index:2000;transition:transform .3s;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}
/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-l)}
.empty-state .emoji{font-size:64px;margin-bottom:12px}
.empty-state p{font-size:20px}
/* Back button */
.back-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back-btn{
  background:#fff;border:2px solid #E0E0E0;border-radius:50%;width:48px;height:48px;
  font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.back-title{font-size:24px;font-weight:700;flex:1}
/* Stats */
.stats-row{display:flex;gap:8px;margin-bottom:16px}
.stat-box{
  flex:1;background:var(--card);border-radius:12px;padding:12px;text-align:center;
  box-shadow:var(--shadow);
}
.stat-num{font-size:28px;font-weight:700}
.stat-label{font-size:14px;color:var(--text-l)}
.stat-box.red .stat-num{color:var(--red)}
.stat-box.yellow .stat-num{color:#E6A800}
.stat-box.green .stat-num{color:var(--green)}
/* Section title */
.section-title{
  font-size:22px;font-weight:700;margin:20px 0 12px;display:flex;
  align-items:center;gap:8px;
}
/* Sort chip */
.sort-chip{
  margin-left:auto;background:#fff;border:2px solid #E0E0E0;border-radius:20px;
  padding:6px 14px;font-size:15px;cursor:pointer;color:var(--text-l);
  font-weight:600;font-family:inherit;transition:all .12s;flex-shrink:0;
}
.sort-chip:active{transform:scale(.95)}
.sort-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Completion */
.completion-screen{text-align:center;padding:40px 20px}
.completion-screen .big-emoji{font-size:80px;margin-bottom:16px}
.completion-screen h2{font-size:28px;color:var(--primary);margin-bottom:12px}
.completion-screen p{font-size:20px;color:var(--text-l);margin-bottom:24px}
/* ===== 看图说话 Story ===== */
.story-card{
  background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;
}
.story-cover{
  width:76px;height:76px;border-radius:12px;background:#F0F0F0;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;
}
.story-cover img{width:100%;height:100%;object-fit:cover}
.story-info{flex:1;min-width:0}
.story-name{font-size:22px;font-weight:700;color:var(--primary)}
.story-meta{font-size:14px;color:var(--text-l)}
.story-page-btn{font-size:18px;padding:10px 14px}
/* 故事编辑页：每张图片一页 */
.story-page-edit{
  background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:14px;
  box-shadow:var(--shadow);position:relative;
}
.story-page-num{
  position:absolute;top:10px;left:10px;background:var(--primary);color:#fff;
  border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;z-index:2;
}
.story-page-edit img{
  width:100%;max-height:300px;object-fit:contain;border-radius:12px;
  background:#F6F6F6;margin-bottom:10px;cursor:pointer;display:block;
}
.story-page-remove{
  position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;
  border:none;background:var(--red);color:#fff;font-size:18px;cursor:pointer;z-index:2;
}
.story-prompt-input{
  width:100%;padding:12px 14px;font-size:18px;border:2px solid #E0E0E0;
  border-radius:12px;font-family:inherit;background:#fff;resize:vertical;
  min-height:60px;
}
.story-prompt-input:focus{outline:none;border-color:var(--primary)}
.story-replace-hint{
  text-align:center;font-size:14px;color:var(--text-l);margin:-4px 0 8px;
}
.story-add-btn{
  width:100%;padding:20px;font-size:22px;border:3px dashed var(--primary-l);
  border-radius:var(--radius);background:#F8F7FF;color:var(--primary);
  cursor:pointer;font-weight:700;font-family:inherit;margin-bottom:14px;
}
.story-add-btn:active{transform:scale(.98)}
/* 故事查看页 */
.story-view-header{text-align:center;margin-bottom:12px}
.story-view-header .sv-title{font-size:26px;font-weight:700;color:var(--primary)}
.story-view-progress{font-size:18px;color:var(--text-l);margin-top:4px}
.story-view-image{
  width:100%;max-height:52vh;object-fit:contain;border-radius:var(--radius);
  background:#F6F6F6;box-shadow:var(--shadow);margin-bottom:14px;display:block;
}
.story-view-prompt{
  background:var(--card);border-radius:var(--radius);padding:18px;font-size:24px;
  line-height:1.8;box-shadow:var(--shadow);margin-bottom:16px;text-align:center;
  white-space:pre-wrap;word-break:break-word;min-height:80px;
}
.story-view-nav{display:flex;gap:10px;align-items:center}
.story-view-nav .btn{flex:1}
.story-view-nav .sv-count{font-size:18px;color:var(--text-l);flex-shrink:0}
.story-view-start-hint{font-size:18px;color:var(--text-l);text-align:center;margin-bottom:16px}
</style>
</head>
<body>

<div id="app">
  <div id="page-home" class="page"></div>
  <div id="page-library" class="page hidden"></div>
  <div id="page-group" class="page hidden"></div>
  <div id="page-word-edit" class="page hidden"></div>
  <div id="page-all-words" class="page hidden"></div>
  <div id="page-add-to-lib" class="page hidden"></div>
  <div id="page-review-select" class="page hidden"></div>
  <div id="page-review" class="page hidden"></div>
  <div id="page-story-home" class="page hidden"></div>
  <div id="page-story-lib" class="page hidden"></div>
  <div id="page-story-edit" class="page hidden"></div>
  <div id="page-story-view" class="page hidden"></div>
</div>

<div id="image-viewer" class="image-viewer" onclick="closeImageViewer()">
  <img id="viewer-img" src="" alt="">
  <div class="close-hint">点击任意位置关闭</div>
</div>

<div id="confirm-modal" class="modal-overlay">
  <div class="modal-box">
    <p id="confirm-text"></p>
    <div class="modal-buttons">
      <button class="btn btn-gray" onclick="closeConfirm(false)">取消</button>
      <button class="btn btn-red" onclick="closeConfirm(true)">确定</button>
    </div>
  </div>
</div>

<div id="input-modal" class="modal-overlay">
  <div class="modal-box">
    <p id="input-modal-title"></p>
    <input type="text" id="input-modal-field" class="modal-input" autocomplete="off">
    <div class="modal-buttons">
      <button class="btn btn-gray" onclick="closeInputModal(null)">取消</button>
      <button class="btn btn-primary" onclick="submitInputModal()">确定</button>
    </div>
  </div>
</div>

<input type="file" id="image-file-input" accept="image/*" multiple style="display:none">
<input type="file" id="story-image-input" accept="image/*" multiple style="display:none">
<input type="file" id="backup-file-input" accept=".json,application/json" style="display:none">

<script>
/* ========== State ========== */
const LS_LIBRARIES = 'wordbook_libraries';
const LS_WORDS = 'wordbook_words';
const LS_SORT = 'wordbook_sort';
const LS_STORY_LIBS = 'wordbook_storyLibs';
const LS_STORIES = 'wordbook_stories';
const DB_NAME = 'KidsWordbookDB';
const DB_VERSION = 3;
const STORE_IMAGES = 'images';
const STORE_STORY_IMAGES = 'storyImages';

const state = {
  libraries: [],
  words: [],
  currentPage: 'home',
  currentLibraryId: null,
  currentGroupId: null,
  editingWord: null,
  editReturn: null,
  reviewWords: [],
  reviewIndex: 0,
  reviewFilter: null,
  reviewCollapsedLibs: {},
  reviewExcludeGreen: false, // 乱序复习时排除已会(🟢)的单词
  showHiddenLibs: false, // 首页是否展开显示隐藏的词库
  storyLibs: [],
  stories: [],
  currentStoryLibId: null,
  currentStoryGroupId: null,
  editingStory: null,
  storyReplaceIndex: null, // 替换图片模式下待替换的页索引（null 表示新增模式）
  editingStoryNewPages: [],  // 新上传待保存的页面图片 {pageId, data}
  editingStoryOldPageIds: [], // 编辑前已有的页面 id（用于删除时清理图片）
  storyPlacementsCollapsed: true, // 归属故事库与分组默认折叠
  storyEditCollapsedLibs: {},
  storyViewStory: null,
  storyViewImages: [],
  storyViewIndex: 0,
};

/* ========== IndexedDB ========== */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE_IMAGES)){
        const store = db.createObjectStore(STORE_IMAGES,{keyPath:'id'});
        store.createIndex('wordId','wordId',{unique:false});
      } else {
        // 旧版本数据库升级：补充 wordId 索引
        const store = req.transaction.objectStore(STORE_IMAGES);
        if(!store.indexNames.contains('wordId')){
          store.createIndex('wordId','wordId',{unique:false});
        }
      }
      if(!db.objectStoreNames.contains(STORE_STORY_IMAGES)){
        const stStore = db.createObjectStore(STORE_STORY_IMAGES,{keyPath:'id'});
        stStore.createIndex('storyId','storyId',{unique:false});
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function dbSaveImage(img){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_IMAGES,'readwrite');
    tx.objectStore(STORE_IMAGES).put(img);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function dbGetImagesByWord(wordId){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_IMAGES,'readonly');
    const store = tx.objectStore(STORE_IMAGES);
    let req;
    try{
      if(store.indexNames.contains('wordId')){
        req = store.index('wordId').getAll(wordId);
      } else {
        req = store.getAll();
      }
    }catch(e){ reject(e); return; }
    req.onsuccess = ()=>{
      let result = req.result || [];
      if(!store.indexNames.contains('wordId')){
        result = result.filter(i=>i.wordId===wordId);
      }
      // 按 sort 排序（旧数据无 sort 字段排到最后），保证拖拽排序持久化
      result.sort((a,b)=>{
        const sa = (a.sort===undefined ? 999 : a.sort);
        const sb = (b.sort===undefined ? 999 : b.sort);
        return sa - sb;
      });
      resolve(result);
    };
    req.onerror = ()=>reject(req.error);
  });
}

/* ========== Utilities ========== */
function genId(prefix){
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function escapeHtml(text){
  const d = document.createElement('div');
  d.textContent = text || '';
  return d.innerHTML;
}

/* ========== Sort Preferences ========== */
function getSortPref(){
  try{ return JSON.parse(localStorage.getItem(LS_SORT)) || {}; }
  catch(e){ return {}; }
}
function saveSortPref(p){
  localStorage.setItem(LS_SORT, JSON.stringify(p));
}
function sortByText(arr, key){
  return arr.slice().sort((a,b)=>{
    const x = String(a[key]||'').toLowerCase();
    const y = String(b[key]||'').toLowerCase();
    return x.localeCompare(y, 'zh-CN', {numeric:true});
  });
}

/* ========== Library Drag Sort ========== */
let dragLibId = null;
function dragLibStart(e, libId){
  dragLibId = libId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', libId);
  try{ e.dataTransfer.setData('text/uri-list', ''); }catch(err){}
  e.currentTarget.classList.add('dragging');
}
function dragLibOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function dragLibLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function dragLibDrop(e, targetLibId){
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  if(!dragLibId || dragLibId === targetLibId){ dragLibId = null; return; }
  const from = state.libraries.findIndex(l=>l.id===dragLibId);
  const to = state.libraries.findIndex(l=>l.id===targetLibId);
  if(from < 0 || to < 0){ dragLibId = null; return; }
  const moved = state.libraries.splice(from,1)[0];
  state.libraries.splice(to,0,moved);
  saveLibraries();
  // 手动排序后切回“原顺序”模式，让新顺序立即可见
  const p = getSortPref();
  if(p.libs === 'name'){ p.libs = 'default'; saveSortPref(p); }
  dragLibId = null;
  renderHome();
  showToast('词库顺序已更新');
}
function dragLibEnd(){
  document.querySelectorAll('#page-home .lib-card').forEach(s=>{
    s.classList.remove('dragging');
    s.classList.remove('drag-over');
  });
  dragLibId = null;
}

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>t.remove(),300);
  },2200);
}

async function loadThumbnails(wordIds){
  let allImages = [];
  try{
    allImages = await dbGetAllImages();
  }catch(err){
    // IndexedDB 读取失败时，缩略图保持占位符，不影响单词列表
  }
  // 按 wordId 分组，一次查询即可为全部单词提供缩略图
  const byWord = {};
  for(const img of allImages){
    if(!img || !img.wordId) continue;
    if(!byWord[img.wordId]) byWord[img.wordId] = [];
    byWord[img.wordId].push(img);
  }
  for(const id of wordIds){
    const images = byWord[id] || [];
    if(images.length > 0 && images[0].data){
      const el = document.getElementById('thumb-'+id);
      if(el){
        el.innerHTML = `<img src="${images[0].data}" alt="" onerror="this.parentNode.innerHTML='🖼️'">`;
        el.onclick = ()=>showImageFullscreen(images[0].data);
      }
    }
  }
}
async function loadThumbDetail(wordId){
  let images = [];
  try{
    images = await dbGetImagesByWord(wordId);
  }catch(err){}
  if(images.length > 0 && images[0].data){
    showImageFullscreen(images[0].data);
  }
}

// 图片拖拽排序
let dragImageIndex = null;
function dragImageStart(e, index){
  dragImageIndex = index;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(index));
  try{ e.dataTransfer.setData('text/uri-list', ''); }catch(err){}
  e.currentTarget.classList.add('dragging');
}
function dragImageOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function dragImageLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function dragImageDrop(e, targetIndex){
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  if(dragImageIndex===null || dragImageIndex===targetIndex){ dragImageIndex=null; return; }
  const ew = state.editingWord;
  const moved = ew.images.splice(dragImageIndex, 1)[0];
  ew.images.splice(targetIndex, 0, moved);
  dragImageIndex = null;
  renderWordEditImages();
}
function dragImageEnd(){
  document.querySelectorAll('#image-slots .image-slot').forEach(s=>{
    s.classList.remove('dragging');
    s.classList.remove('drag-over');
  });
  dragImageIndex = null;
}
function removeImageFromEditing(index){
  state.editingWord.images.splice(index, 1);
  renderWordEditImages();
}
function resizeImage(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxWidth){
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Image load error'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('File read error'));
    reader.readAsDataURL(file);
  });
}
function cancelEditWord(){
  state.editingWord = null;
  goBackFromEdit();
}
function recordEditReturn(){
  const p = state.currentPage;
  const scrollY = window.scrollY || 0;
  if(p === 'page-all-words'){
    const se = document.getElementById('search-input');
    state.editReturn = {type:'allWords', filter: state.allWordsFilter || null, scrollY, search: se ? se.value : ''};
  } else if(p === 'page-group'){
    state.editReturn = {type:'group', libraryId: state.currentLibraryId, groupId: state.currentGroupId, scrollY};
  } else if(p === 'page-library'){
    state.editReturn = {type:'library', libraryId: state.currentLibraryId, scrollY};
  } else if(p === 'page-add-to-lib'){
    state.editReturn = {type:'addToLib', libraryId: state.currentLibraryId, scrollY};
  } else {
    state.editReturn = {type:'home', scrollY};
  }
}
function goBackFromEdit(){
  const r = state.editReturn;
  const restoreY = (r && r.scrollY) ? r.scrollY : 0;
  if(r && r.type === 'allWords'){
    navigateAllWords(r.filter);
    if(r.search){
      const se = document.getElementById('search-input');
      if(se){
        se.value = r.search;
        searchWords(r.search);
      }
    }
  } else if(r && r.type === 'group'){
    navigateGroup(r.libraryId, r.groupId);
  } else if(r && r.type === 'library'){
    navigateLibrary(r.libraryId);
  } else if(r && r.type === 'addToLib'){
    navigateAddToLib(r.libraryId);
  } else if(state.currentGroupId && state.currentLibraryId){
    navigateGroup(state.currentLibraryId, state.currentGroupId);
  } else if(state.currentLibraryId){
    navigateLibrary(state.currentLibraryId);
  } else {
    navigateHome();
  }
  state.editReturn = null;
  if(restoreY > 0){
    requestAnimationFrame(()=>window.scrollTo(0, restoreY));
  }
}
async function saveWord(){
  const ew = state.editingWord;
  const english = document.getElementById('input-english').value.trim();
  const chinese = document.getElementById('input-chinese').value.trim();
  if(!english){
    showToast('请输入英文单词');
    return;
  }
  // Check for duplicate (case-insensitive)
  if(state.words.some(w=>w.id!==ew.id && w.english.toLowerCase()===english.toLowerCase())){
    showToast('单词已存在');
    return;
  }
  ew.english = english;
  ew.chinese = chinese;

  // Save new images / delete removed images (IndexedDB 异常时不影响单词文字保存)
  try{
    // 按当前数组顺序写入排序号，保证拖拽排序可持久化
    for(const img of ew.images){
      img.sort = ew.images.indexOf(img);
      await dbSaveImage({id:img.id, wordId:ew.id, data:img.data, sort:img.sort});
    }
    const currentIds = ew.images.map(i=>i.id);
    for(const oldId of ew.originalImageIds){
      if(!currentIds.includes(oldId)){
        await dbDeleteImage(oldId);
      }
    }
  }catch(err){
    // 忽略图片存储错误，单词文字照常保存
  }
  // Save word
  const wordData = {
    id: ew.id,
    english: ew.english,
    chinese: ew.chinese,
    label: ew.label,
    placements: ew.placements
  };
  const idx = state.words.findIndex(w=>w.id===ew.id);
  if(idx >= 0){
    state.words[idx] = wordData;
  } else {
    state.words.push(wordData);
  }
  saveWords();
  state.editingWord = null;
  showToast('保存成功！');
  goBackFromEdit();
}

/* ========== Label Cycling ========== */
function cycleLabel(wordId, element){
  const word = state.words.find(w=>w.id===wordId);
  if(!word) return;
  const order = ['red','yellow','green'];
  const idx = order.indexOf(word.label);
  word.label = order[(idx+1)%3];
  saveWords();
  // Update UI
  const card = element.closest('.word-card');
  card.className = 'word-card ' + word.label;
  const labelEmoji = {red:'🔴',yellow:'🟡',green:'🟢'};
  element.className = 'label-dot ' + word.label;
  element.textContent = labelEmoji[word.label];
  // Update stats if on home page
  if(state.currentPage === 'home'){
    renderHome();
  }
}

async function deleteLibrary(id){
  const lib = state.libraries.find(l=>l.id===id);
  if(!lib) return;
  const ok = await showConfirm(`确定删除词库「${lib.name}」吗？词库内单词不会被删除，但会移出该词库。`);

  for(const word of state.words){

  state.libraries = state.libraries.filter(l=>l.id!==id);

async function deleteGroup(libId, groupId){

  const group = lib.groups.find(g=>g.id===groupId);
  if(!group) return;
  const ok = await showConfirm(`确定删除分组「${group.name}」吗？分组内单词不会被删除，但会移出该分组。`);

  lib.groups = lib.groups.filter(g=>g.id!==groupId);
  saveLibraries();
  renderLibrary();
  showToast('分组已删除');

}
function toggleAddToLib(wordId, libId, groupId){
  const word = state.words.find(w=>w.id===wordId);
  if(!word) return;
  const idx = word.placements.findIndex(p=>p.libraryId===libId && p.groupId===groupId);
  if(idx >= 0){
    word.placements.splice(idx, 1);
  } else {
    word.placements.push({libraryId:libId, groupId:groupId});
  }
  saveWords();
  // Re-render list with current search
  const lib = state.libraries.find(l=>l.id===libId);
  const searchEl = document.getElementById('add-to-lib-search');
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  let words = state.words;
  if(q){
    words = words.filter(w=>w.english.toLowerCase().includes(q) || (w.chinese||'').toLowerCase().includes(q));
  }
  renderAddToLibList(words, lib);
}
function searchAddToLib(query){
  const lib = state.libraries.find(l=>l.id===state.currentLibraryId);
  if(!lib) return;
  const q = query.trim().toLowerCase();
  let words = state.words;
  if(q){
    words = words.filter(w=>w.english.toLowerCase().includes(q) || (w.chinese||'').toLowerCase().includes(q));
  }
  renderAddToLibList(words, lib);
}

function sanitizeFilename(name){

/* ========== docx 导出工具（Word 的 .doc HTML 不支持 base64 图片，必须生成真正内嵌图片的 .docx） ========== */
const EMU_PER_PX = 9525;
const _crcTable = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c; }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = _crcTable[(c^buf[i])&0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function buildZip(files){
  const enc = new TextEncoder();
  const d = new Date();
  const dosTime = ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dosDate = (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const parts = [], central = [];
  let offset = 0;
  for(const f of files){
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    parts.push(local, data);
    const cen = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    cen.set(nameBytes, 46);
    central.push(cen);
    offset += local.length + data.length;
  }
  const centralSize = central.reduce((s,c)=>s+c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function dataUrlToBytes(dataUrl){
  const bin = atob((String(dataUrl).split(',')[1]) || '');
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function loadImageSize(dataUrl){
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>res({w: im.naturalWidth, h: im.naturalHeight});
    im.onerror = ()=>res({w: 0, h: 0});
    im.src = dataUrl;
  });
}
async function ensureDocxImage(dataUrl){
  const mime = (String(dataUrl).match(/^data:(image\/[a-z+]+);/i)||[])[1];
  if(mime === 'image/jpeg') return {bytes: dataUrlToBytes(dataUrl), ext: 'jpeg'};
  if(mime === 'image/png') return {bytes: dataUrlToBytes(dataUrl), ext: 'png'};
  const pngUrl = await new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      c.getContext('2d').drawImage(im, 0, 0);
      res(c.toDataURL('image/png'));
    };
    im.onerror = ()=>res(null);
    im.src = dataUrl;
  });
  if(!pngUrl) return {bytes: dataUrlToBytes(dataUrl), ext: 'png'};
  return {bytes: dataUrlToBytes(pngUrl), ext: 'png'};
}
function xmlEsc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dxRun(text, o){
  o = o || {};
  let rPr = '';
  if(o.bold || o.color || o.size){
    rPr = '<w:rPr>' + (o.bold?'<w:b/>':'') + (o.color?`<w:color w:val="${o.color}"/>`:'') + (o.size?`<w:sz w:val="${o.size}"/>`:'') + '</w:rPr>';
  }
  return `<w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`;
}
function dxPara(runsXml, o){
  o = o || {};
  let pPr = '';
  if(o.align || o.pageBreakBefore) pPr = '<w:pPr>' + (o.pageBreakBefore?'<w:pageBreakBefore/>':'') + (o.align?`<w:jc w:val="${o.align}"/>`:'') + '</w:pPr>';
  return `<w:p>${pPr}${runsXml || ''}</w:p>`;
}
function dxPageBreak(){
  return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
}
function dxImageRun(rid, cx, cy, id){
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${id}" name="Picture ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="image${id}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
function dxCell(parasXml, o){
  o = o || {};
  const tcPr = '<w:tcPr>' + (o.shd?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>`:'') + '<w:vAlign w:val="center"/></w:tcPr>';
  return `<w:tc>${tcPr}${parasXml}</w:tc>`;
}
function dxTable(rowsXml){
  const borders = ['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:color="BBBBBB"/>`).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>${borders}</w:tblBorders></w:tblPr><w:tblGrid><w:gridCol w:w="2200"/><w:gridCol w:w="2400"/><w:gridCol w:w="2800"/><w:gridCol w:w="1500"/></w:tblGrid>${rowsXml}</w:tbl>`;
}
function createDocxBuilder(){
  const imgs = [];
  async function addImage(dataUrl, maxWpx, maxHpx){
    const size = await loadImageSize(dataUrl);
    let cx = (size.w || 100) * EMU_PER_PX;
    let cy = (size.h || 100) * EMU_PER_PX;
    const maxW = (maxWpx || 0) * EMU_PER_PX, maxH = (maxHpx || 0) * EMU_PER_PX;
    if(maxW && cx > maxW){ cy = Math.round(cy * maxW / cx); cx = maxW; }
    if(maxH && cy > maxH){ cx = Math.round(cx * maxH / cy); cy = maxH; }
    imgs.push(dataUrl);
    const n = imgs.length;
    return dxImageRun('rIdImg' + n, cx, cy, n);
  }
  async function build(bodyXml){
    const enc = new TextEncoder();
    const media = [], rels = [];
    for(let i=0;i<imgs.length;i++){
      const conv = await ensureDocxImage(imgs[i]);
      media.push({name: `word/media/image${i+1}.${conv.ext}`, data: conv.bytes});
      rels.push(`<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i+1}.${conv.ext}"/>`);
    }
    const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${bodyXml}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>`;
    const ctXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
    const relsRootXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdDoc" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
    const relsDocXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`;
    return buildZip([
      {name: '[Content_Types].xml', data: enc.encode(ctXml)},
      {name: '_rels/.rels', data: enc.encode(relsRootXml)},
      {name: 'word/document.xml', data: enc.encode(docXml)},
      {name: 'word/_rels/document.xml.rels', data: enc.encode(relsDocXml)},
      ...media
    ]);
  }
  return {addImage, build};
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

  const labelText = {red:'不会',yellow:'想一想',green:'会'};
  const B = createDocxBuilder();
  const header = ['单词','备注','图片','标签'].map(t=>
    dxCell(dxPara(dxRun(t,{bold:true,size:15,color:'FFFFFF'}),{align:'center'}),{shd:'6C5CE7'})
  ).join('');
  let rowsXml = `<w:tr>${header}</w:tr>`;
  for(const w of words){
    const images = await dbGetImagesByWord(w.id);
    let imgPara;
    if(images.length > 0){
      const runs = [];
      for(const im of images) runs.push(await B.addImage(im.data, 80, 80));
      imgPara = dxPara(runs.join(''));
    }else{
      imgPara = dxPara('');
    }
    const label = ((labelEmoji[w.label]||'') + ' ' + (labelText[w.label]||'')).trim();
    rowsXml += `<w:tr>${dxCell(dxPara(dxRun(w.english,{size:14})))}${dxCell(dxPara(dxRun(w.chinese||'',{size:14})))}${dxCell(imgPara)}${dxCell(dxPara(dxRun(label,{size:14}),{align:'center'}))}</w:tr>`;
  }
  const body = dxPara(dxRun(title,{bold:true,size:22,color:'6C5CE7'}),{align:'center'})
    + dxPara(dxRun(`导出时间：${new Date().toLocaleString()} · 共 ${words.length} 个单词`,{size:11,color:'999999'}),{align:'center'})
    + dxTable(rowsXml)
    + dxPara('');
  downloadBlob(await B.build(body), sanitizeFilename(title) + '.docx');
  showToast('Word 已导出！');
}
async function exportLibWord(libId){
  const lib = state.libraries.find(l=>l.id===libId);
  if(!lib) return;
  const words = state.words.filter(w=>w.placements.some(p=>p.libraryId===libId));
  await exportWordsToWord(words, `单词表_${lib.name}`);
}
async function exportGroupWord(libId, groupId){
  const lib = state.libraries.find(l=>l.id===libId);
  if(!lib) return;
  const group = lib.groups.find(g=>g.id===groupId);
  if(!group) return;
  const words = state.words.filter(w=>w.placements.some(p=>p.libraryId===libId && p.groupId===groupId));
  await exportWordsToWord(words, `单词表_${lib.name}_${group.name}`);
}

/* ========== 故事导出 Word ========== */
async function exportStoryWord(storyId){
  const story = state.stories.find(s=>s.id===storyId);
  if(!story) return;
  const images = await dbGetStoryImages(storyId);
  if(!images.length){ showToast('这个故事没有图片可导出'); return; }
  showToast('正在生成 Word...');
  const B = createDocxBuilder();
  let body = dxPara(dxRun(story.title,{bold:true,size:26,color:'6C5CE7'}),{align:'center'})
    + dxPara(dxRun(`导出时间：${new Date().toLocaleString()} · 共 ${images.length} 张图片 · 一页一张图，方便打印`,{size:11,color:'999999'}),{align:'center'});
  for(let i=0;i<images.length;i++){
    const img = images[i];
    const page = story.pages.find(p=>p.id===img.id);
    const prompt = page && page.prompt && page.prompt.trim() ? page.prompt.trim() : '';
    if(i>0) body += dxPageBreak();
    body += dxPara(dxRun(`第 ${i+1} 页`,{size:14,color:'999999'}),{align:'center'});
    body += dxPara(await B.addImage(img.data, 440, 540), {align:'center'});
    if(prompt) body += dxPara(dxRun(prompt,{size:16,color:'333333'}),{align:'center'});
  }
  body += dxPara('');
  downloadBlob(await B.build(body), sanitizeFilename('故事_' + story.title) + '.docx');
  showToast('故事 Word 已导出！');
}

/* ========== 看图说话 Story ========== */
function getStoryLibStoryCount(libId){
  return state.stories.filter(s=>s.placements.some(p=>p.libraryId===libId)).length;
}
function getStoryGroupStoryCount(libId, groupId){
  return state.stories.filter(s=>s.placements.some(p=>p.libraryId===libId && p.groupId===groupId)).length;
}
async function loadStoryCovers(storyIds){
  let allImages = [];
  try{
    allImages = await dbGetAllStoryImages();
  }catch(err){}
  const byStory = {};
  for(const img of allImages){
    if(!img || !img.storyId) continue;
    if(!byStory[img.storyId]) byStory[img.storyId] = [];
    byStory[img.storyId].push(img);
  }
  for(const id of storyIds){
    const images = byStory[id] || [];
    if(images.length > 0 && images[0].data){
      const el = document.getElementById('story-cover-'+id);
      if(el){
        el.innerHTML = `<img src="${images[0].data}" alt="" onerror="this.innerHTML='🖼️'">`;
      }
    }
  }
}
function renderStoryCard(story){
  return `
    <div class="story-card" onclick="navigateStoryView('${story.id}')">
      <div class="story-cover" id="story-cover-${story.id}">🖼️</div>
      <div class="story-info">
        <div class="story-name">${escapeHtml(story.title)}</div>
        <div class="story-meta">${story.pages.length} 张图片</div>

      <button class="btn btn-small btn-white story-page-btn" title="导出 Word" onclick="event.stopPropagation();exportStoryWord('${story.id}')">📤</button>
      <button class="btn btn-small btn-white story-page-btn" onclick="event.stopPropagation();startStoryEditById('${story.id}')">✏️</button>
      <button class="btn btn-small btn-red story-page-btn" onclick="event.stopPropagation();deleteStory('${story.id}')">🗑️</button>

}

/* ===== 故事库页面 ===== */
function navigateStoryLib(libId){
  state.currentStoryLibId = libId;
  state.currentStoryGroupId = null;
  renderStoryLib();
  showPage('page-story-lib');
}
function renderStoryLib(){
  const lib = state.storyLibs.find(l=>l.id===state.currentStoryLibId);
  if(!lib){ navigateStoryHome(); return; }
  const stories = state.stories.filter(s=>s.placements.some(p=>p.libraryId===lib.id));
  // 按分组展示：每个分组一个小标题，未分组故事放最后
  let bodyHTML = '';
  for(const g of lib.groups){
    const gStories = stories.filter(s=>s.placements.some(p=>p.libraryId===lib.id && p.groupId===g.id));
    if(gStories.length === 0) continue;
    bodyHTML += `
      <div class="section-title" style="margin-top:8px">📄 ${escapeHtml(g.name)} (${gStories.length})
        <button class="btn btn-small btn-white" style="margin-left:6px" onclick="renameStoryGroup('${lib.id}','${g.id}')">✏️</button>
        <button class="btn btn-small btn-red" style="margin-left:6px" onclick="deleteStoryGroup('${lib.id}','${g.id}')">🗑️</button>
      </div>
      <div id="story-group-${g.id}"></div>`;
  }
  const ungrouped = stories.filter(s=>!s.placements.some(p=>p.libraryId===lib.id && p.groupId));
  if(ungrouped.length){
    bodyHTML += `<div class="section-title" style="margin-top:8px">📄 默认分组 (${ungrouped.length})</div>
      <div id="story-group-default"></div>`;
  }
  if(!bodyHTML){
    bodyHTML = `<div class="empty-state"><div class="emoji">🎨</div><p>这个故事库还没有故事</p></div>`;
  }
  document.getElementById('page-story-lib').innerHTML = `
    <div class="back-bar">
      <button class="back-btn" onclick="navigateStoryHome()">←</button>
      <div class="back-title">🗂️ ${escapeHtml(lib.name)}</div>
      <button class="btn btn-small btn-white" onclick="navigateHome()">🏠</button>
      <button class="btn btn-small btn-white" onclick="renameStoryLib('${lib.id}')">✏️</button>
      <button class="btn btn-small btn-red" onclick="deleteStoryLib('${lib.id}')">🗑️</button>
    </div>
    <div class="btn-row" style="margin-bottom:12px">
      <button class="btn btn-blue" onclick="createStoryGroup('${lib.id}')">➕ 新建分组</button>
      <button class="btn btn-green" onclick="startStoryEdit('${lib.id}')">➕ 新建故事</button>
    </div>
    ${bodyHTML}
  `;
  // 逐个分组渲染故事卡片
  for(const g of lib.groups){
    const gStories = stories.filter(s=>s.placements.some(p=>p.libraryId===lib.id && p.groupId===g.id));
    if(gStories.length) renderStoryCards('story-group-'+g.id, gStories);
  }
  if(ungrouped.length) renderStoryCards('story-group-default', ungrouped);
}

/* ===== 故事库/分组管理 ===== */
async function createStoryLib(){
  const name = await showInputModal('输入故事库名称', '');
  if(!name) return;
  state.storyLibs.push({
    id: genId('slib'),
    name: name,
    groups: [{id:genId('sgrp'), name:'默认分组'}]
  });
  saveStoryLibs();
  renderStoryHome();
  showToast('故事库已创建');
}
async function renameStoryLib(id){
  const lib = state.storyLibs.find(l=>l.id===id);
  if(!lib) return;
  const name = await showInputModal('修改故事库名称', lib.name);
  if(!name) return;
  lib.name = name;
  saveStoryLibs();
  if(state.currentPage === 'page-story-home') renderStoryHome();
  if(state.currentPage === 'page-story-lib') renderStoryLib();
}
async function deleteStoryLib(id){
  const lib = state.storyLibs.find(l=>l.id===id);
  if(!lib) return;
  const ok = await showConfirm(`确定删除故事库「${lib.name}」吗？故事不会被删除，但会移出该故事库。`);
  if(!ok) return;
  for(const story of state.stories){
    story.placements = story.placements.filter(p=>p.libraryId!==id);
  }
  saveStories();
  state.storyLibs = state.storyLibs.filter(l=>l.id!==id);
  saveStoryLibs();
  renderStoryHome();
  showToast('故事库已删除');
}
async function createStoryGroup(libId){
  const name = await showInputModal('输入分组名称', '');
  if(!name) return;
  const lib = state.storyLibs.find(l=>l.id===libId);
  if(!lib) return;
  lib.groups.push({id:genId('sgrp'), name:name});
  saveStoryLibs();
  renderStoryLib();
  showToast('分组已创建');
}
async function renameStoryGroup(libId, groupId){
  const lib = state.storyLibs.find(l=>l.id===libId);
  if(!lib) return;
  const group = lib.groups.find(g=>g.id===groupId);
  if(!group) return;
  const name = await showInputModal('修改分组名称', group.name);
  if(!name) return;
  group.name = name;
  saveStoryLibs();
  if(state.currentPage === 'page-story-lib') renderStoryLib();
}
async function deleteStoryGroup(libId, groupId){
  const lib = state.storyLibs.find(l=>l.id===libId);
  if(!lib) return;
  const group = lib.groups.find(g=>g.id===groupId);
  if(!group) return;
  const ok = await showConfirm(`确定删除分组「${group.name}」吗？故事不会被删除，但会移出该分组。`);
  if(!ok) return;
  for(const story of state.stories){
    story.placements = story.placements.filter(p=>!(p.libraryId===libId && p.groupId===groupId));
  }
  saveStories();
  lib.groups = lib.groups.filter(g=>g.id!==groupId);
  saveStoryLibs();
  renderStoryLib();
  showToast('分组已删除');
}

/* ===== 故事编辑 ===== */
async function startStoryEdit(preLib, preGroup){
  if(preLib === undefined || preLib === null){
    // 新建故事：记住返回页
    state.storyEditReturn = {type:'home'};
  } else {
    state.storyEditReturn = {type:'lib', libId: preLib};
  }
  state.storyPlacementsCollapsed = true;
  state.storyEditCollapsedLibs = {};
  const story = {
    id: genId('story'),
    title: '',
    placements: [],
    pages: []
  };
  if(preLib){
    story.placements = [{libraryId: preLib, groupId: preGroup || null}];
  }
  state.editingStory = story;
  state.editingStoryOldPageIds = [];
  state.storyReplaceIndex = null;
  renderStoryEdit();
  showPage('page-story-edit');
}
async function startStoryEditById(storyId){
  const story = state.stories.find(s=>s.id===storyId);
  if(!story) return;
  state.storyEditReturn = {type:'storyBack'};
  state.storyPlacementsCollapsed = true;
  state.storyEditCollapsedLibs = {};
  state.storyReplaceIndex = null;
  const images = await dbGetStoryImages(storyId);
  state.editingStory = {
    id: story.id,
    title: story.title,
    placements: story.placements.map(p=>({...p})),
    pages: story.pages.map((p,i)=>{
      const img = images.find(im=>im.id===p.id);
      return {id:p.id, prompt:p.prompt||'', data: img ? img.data : null};
    })
  };
  state.editingStoryOldPageIds = story.pages.map(p=>p.id);
  renderStoryEdit();
  showPage('page-story-edit');
}
function renderStoryEdit(){
  const es = state.editingStory;
  if(!es){ navigateStoryHome(); return; }
  document.getElementById('page-story-edit').innerHTML = `
    <div class="back-bar">
      <button class="back-btn" onclick="cancelStoryEdit()">←</button>
      <div class="back-title">${es.title ? '✏️ 编辑故事' : '🎨 新建故事'}</div>
    </div>
    <div class="form-group">
      <label class="form-label">📝 故事标题</label>
      <input type="text" class="form-input" id="story-title-input" value="${escapeHtml(es.title)}" placeholder="输入故事标题..." autocomplete="off">
    </div>
    <div class="form-group" id="story-placement-form-group"></div>
    <div class="form-group">
      <label class="form-label">🖼️ 故事图片与提示词（最多20张）</label>
      <div id="story-pages-container"></div>
      <button class="story-add-btn" onclick="triggerStoryImageUpload()">📷 添加图片</button>
    </div>
    <button class="btn btn-green btn-large" onclick="saveStory()">💾 保存故事</button>
  `;
  renderStoryEditPages();
  renderStoryEditPlacements();
}
function renderStoryEditPages(){
  const es = state.editingStory;
  let html = '';
  es.pages.forEach((p, i)=>{
    html += `
      <div class="story-page-edit">
        <div class="story-page-num">${i+1}</div>
        <button class="story-page-remove" onclick="removeStoryPage(${i})">✕</button>
        <img src="${p.data}" alt="" onclick="triggerStoryImageReplace(${i})" title="点击替换图片">
        <div class="story-replace-hint">📷 点击图片可替换</div>
        <textarea class="story-prompt-input" placeholder="📝 提示词：这张图讲了什么？可以引导孩子复述..." oninput="state.editingStory.pages[${i}].prompt=this.value">${escapeHtml(p.prompt||'')}</textarea>
      </div>`;
  });
  document.getElementById('story-pages-container').innerHTML = html;
}
function triggerStoryImageUpload(){
  const es = state.editingStory;
  const remaining = 20 - es.pages.length;
  if(remaining <= 0){ showToast('最多只能添加20张图片'); return; }
  const input = document.getElementById('story-image-input');
  input.value = '';
  input.click();
}
function triggerStoryImageReplace(index){
  state.storyReplaceIndex = index;
  const input = document.getElementById('story-image-input');
  input.value = '';
  input.click();
}
document.getElementById('story-image-input').addEventListener('change', async (e)=>{
  const es = state.editingStory;
  if(!es) return;
  const files = Array.from(e.target.files);
  if(!files.length){ state.storyReplaceIndex = null; return; }
  e.target.value = '';
  // 替换模式：用第一张图替换指定页的图片（保留提示词和顺序）
  if(state.storyReplaceIndex !== null && state.storyReplaceIndex !== undefined){
    const idx = state.storyReplaceIndex;
    state.storyReplaceIndex = null;
    const file = files[0];
    if(file && file.type.startsWith('image/') && es.pages[idx]){
      try{
        es.pages[idx].data = await resizeImage(file, 1024, 0.8);
        renderStoryEditPages();
        showToast('图片已替换');
      }catch(err){
        showToast('图片处理失败');
      }
    }
    return;
  }
  const remaining = 20 - es.pages.length;
  const toProcess = files.slice(0, remaining);
  for(const file of toProcess){
    if(!file.type.startsWith('image/')) continue;
    try{
      const data = await resizeImage(file, 1024, 0.8);
      es.pages.push({id:genId('spage'), prompt:'', data:data});
    }catch(err){
      showToast('图片处理失败');
    }
  }
  renderStoryEditPages();
});
function removeStoryPage(index){
  const es = state.editingStory;
  es.pages.splice(index, 1);
  renderStoryEditPages();
}
function renderStoryEditPlacements(){
  const es = state.editingStory;
  const collapsed = !!state.storyPlacementsCollapsed;
  const collapsedLibs = state.storyEditCollapsedLibs || {};
  let html = '';
  if(state.storyLibs.length === 0){
    html = `<p style="color:var(--text-l);font-size:16px">还没有故事库，请先在「看图说话」首页创建故事库和分组。</p>`;
  } else if(!collapsed){
    html = state.storyLibs.map(lib=>{
      const libCollapsed = !!collapsedLibs[lib.id];
      let groupsHTML = '';
      if(lib.groups.length === 0){
        groupsHTML = `<div style="padding:8px 14px 8px 28px;color:var(--text-l);font-size:16px">暂无分组</div>`;
      } else {
        groupsHTML = lib.groups.map(g=>{
          const checked = es.placements.some(p=>p.libraryId===lib.id && p.groupId===g.id);
          return `
            <div class="placement-group ${checked?'checked':''}" onclick="toggleStoryPlacement('${lib.id}','${g.id}')">
              <input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleStoryPlacement('${lib.id}','${g.id}')">
              <span>${escapeHtml(g.name)}</span>
            </div>`;
        }).join('');
      }
      return `
        <div class="placement-section">
          <div class="placement-lib" onclick="toggleStoryLibCollapse('${lib.id}')">
            🗂️ ${escapeHtml(lib.name)}
            <span class="collapse-arrow ${libCollapsed?'':'open'}">▾</span>
          </div>
          <div class="placement-groups ${libCollapsed?'hidden':''}">
            ${groupsHTML}
          </div>
        </div>`;
    }).join('');
  }
  const container = document.getElementById('story-placement-form-group');
  if(container){
    container.innerHTML = `
      <label class="form-label form-label-toggle" onclick="toggleStoryPlacementsCollapse()">
        <span>归属故事库与分组</span>
        <span class="collapse-arrow ${collapsed?'':'open'}">▾</span>
      </label>
      ${html}
    `;
  }
}
function toggleStoryPlacementsCollapse(){
  state.storyPlacementsCollapsed = !state.storyPlacementsCollapsed;
  renderStoryEditPlacements();
}
function toggleStoryLibCollapse(libId){
  if(!state.storyEditCollapsedLibs) state.storyEditCollapsedLibs = {};
  state.storyEditCollapsedLibs[libId] = !state.storyEditCollapsedLibs[libId];
  renderStoryEditPlacements();
}
function toggleStoryPlacement(libId, groupId){
  const es = state.editingStory;
  const existing = es.placements.findIndex(p=>p.libraryId===libId && p.groupId===groupId);
  if(existing >= 0){
    es.placements.splice(existing, 1);
  } else {
    es.placements.push({libraryId:libId, groupId:groupId});
  }
  renderStoryEditPlacements();
}
async function saveStory(){
  const es = state.editingStory;
  if(!es) return;
  const title = document.getElementById('story-title-input').value.trim();
  if(!title){ showToast('请输入故事标题'); return; }
  if(es.pages.length === 0){ showToast('请至少添加一张图片'); return; }
  es.title = title;
  // 保存页面提示词（文本域 oninput 已同步，此处兜底）
  document.querySelectorAll('#page-story-edit .story-prompt-input').forEach((ta, i)=>{
    if(es.pages[i]) es.pages[i].prompt = ta.value;
  });
  // 保存图片到 IndexedDB（异常不影响故事元数据保存）
  try{
    for(let i=0; i<es.pages.length; i++){
      const p = es.pages[i];
      if(p.data){
        await dbSaveStoryImage({id:p.id, storyId:es.id, data:p.data, sort:i});
      }
    }
    const currentIds = es.pages.map(p=>p.id);
    for(const oldId of state.editingStoryOldPageIds){
      if(!currentIds.includes(oldId)) await dbDeleteStoryImage(oldId);
    }
  }catch(err){}
  const storyData = {
    id: es.id,
    title: es.title,
    placements: es.placements,
    pages: es.pages.map(p=>({id:p.id, prompt:p.prompt||''}))
  };
  const idx = state.stories.findIndex(s=>s.id===es.id);
  if(idx >= 0){
    state.stories[idx] = storyData;
  } else {
    state.stories.push(storyData);
  }
  saveStories();
  state.editingStory = null;
  state.editingStoryOldPageIds = [];
  state.storyReplaceIndex = null;
  showToast('故事已保存！');
  goBackFromStoryEdit();
}
function cancelStoryEdit(){
  state.editingStory = null;
  state.editingStoryOldPageIds = [];
  state.storyReplaceIndex = null;
  goBackFromStoryEdit();
}
function goBackFromStoryEdit(){
  const r = state.storyEditReturn || {type:'home'};
  state.storyEditReturn = null;
  if(r.type === 'lib') navigateStoryLib(r.libId);
  else navigateStoryHome();
}
async function deleteStory(storyId){
  const story = state.stories.find(s=>s.id===storyId);
  if(!story) return;
  const ok = await showConfirm(`确定删除故事「${story.title}」吗？`);
  if(!ok) return;
  state.stories = state.stories.filter(s=>s.id!==storyId);
  saveStories();
  for(const p of story.pages){
    try{ await dbDeleteStoryImage(p.id); }catch(err){}
  }
  showToast('故事已删除');
  refreshCurrentPage();
}

/* ===== 故事查看 ===== */
async function navigateStoryView(storyId){
  const story = state.stories.find(s=>s.id===storyId);
  if(!story) return;
  let images = [];
  try{
    images = await dbGetStoryImages(storyId);
  }catch(err){}
  state.storyViewStory = story;
  state.storyViewImages = images;
  state.storyViewIndex = 0;
  renderStoryView();
  showPage('page-story-view');
}
function renderStoryView(){
  const story = state.storyViewStory;
  if(!story || !state.storyViewImages.length){
    document.getElementById('page-story-view').innerHTML = `
      <div class="back-bar">
        <button class="back-btn" onclick="navigateStoryHome()">←</button>
        <div class="back-title">🎨 看图说话</div>
        <button class="btn btn-small btn-white" onclick="navigateHome()">🏠</button>
      </div>
      <div class="empty-state"><div class="emoji">🖼️</div><p>这个故事没有图片</p></div>`;
    return;
  }
  const index = Math.max(0, Math.min(state.storyViewIndex, state.storyViewImages.length-1));
  state.storyViewIndex = index;
  const page = story.pages.find(p=>p.id===state.storyViewImages[index].id) || {prompt:''};
  document.getElementById('page-story-view').innerHTML = `
    <div class="back-bar">
      <button class="back-btn" onclick="navigateStoryHome()">←</button>
      <div class="back-title">${escapeHtml(story.title)}</div>
      <button class="btn btn-small btn-white" onclick="navigateHome()">🏠</button>
      <button class="btn btn-small btn-white" title="导出 Word" onclick="event.stopPropagation();exportStoryWord('${story.id}')">📤</button>
      <button class="btn btn-small btn-white" onclick="event.stopPropagation();startStoryEditById('${story.id}')">✏️</button>
    </div>
    <div class="story-view-header">
      <div class="sv-title">${escapeHtml(story.title)}</div>
      <div class="story-view-progress">第 ${index+1} / ${state.storyViewImages.length} 张</div>
    </div>
    <img class="story-view-image" src="${state.storyViewImages[index].data}" alt="" onclick="showImageFullscreen('${state.storyViewImages[index].data}')">
    ${(page.prompt && page.prompt.trim()) ? `<div class="story-view-prompt">${escapeHtml(page.prompt)}</div>` : ''}
    <div class="story-view-nav">
      <button class="btn btn-gray" onclick="storyViewPrev()" ${index===0?'disabled style="opacity:.5"':''}>⬅️ 上一张</button>
      <button class="btn btn-primary" onclick="storyViewNext()" ${index>=state.storyViewImages.length-1?'disabled style="opacity:.5"':''}>下一张 ➡️</button>
    </div>
    <div class="story-view-start-hint" style="margin-top:14px">👦👧 看着图片，把故事讲出来吧！</div>
  `;
}
function storyViewPrev(){
  if(state.storyViewIndex > 0){
    state.storyViewIndex--;
    renderStoryView();
  }
}
function storyViewNext(){
  if(state.storyViewIndex < state.storyViewImages.length - 1){
    state.storyViewIndex++;
    renderStoryView();
  } else {
    showToast('🎉 故事讲完啦！你真棒！');
  }
}

/* ========== Backup ========== */
async function exportBackup(){
  showToast('正在准备备份...');
  const images = await dbGetAllImages();
  const storyImages = await dbGetAllStoryImages();
  const backup = {
    version: 1,
    exportDate: new Date().toISOString(),
    libraries: state.libraries,
    words: state.words,
    images: images,
    storyLibs: state.storyLibs,
    stories: state.stories,
    storyImages: storyImages
  };
  const json = JSON.stringify(backup);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `单词本备份_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('备份已导出！');
}
document.getElementById('backup-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup.libraries || !backup.words){
      showToast('备份文件格式不正确');
      return;
    }
    const ok = await showConfirm('导入备份将覆盖当前所有数据，确定继续吗？');
    if(!ok) return;
    // Restore data
    state.libraries = backup.libraries;
    state.words = backup.words;
    state.storyLibs = backup.storyLibs || [];
    state.stories = backup.stories || [];
    saveLibraries();
    saveWords();
    saveStoryLibs();
    saveStories();
    // Restore images
    await dbClearAllImages();
    if(backup.images && backup.images.length){
      for(const img of backup.images){
        await dbSaveImage(img);
      }
    }
    await dbClearAllStoryImages();
    if(backup.storyImages && backup.storyImages.length){
      for(const img of backup.storyImages){
        await dbSaveStoryImage(img);
      }
    }
    showToast('备份导入成功！');
    navigateHome();
  }catch(err){
    showToast('导入失败：文件格式错误');
  }
});

/* ========== Navigation Helpers ========== */
function navigateHome(){
  state.currentLibraryId = null;
  state.currentGroupId = null;
  renderHome();
  showPage('page-home');
}
function refreshCurrentPage(){
  if(state.currentPage === 'page-home') renderHome();
  else if(state.currentPage === 'page-library') renderLibrary();
  else if(state.currentPage === 'page-group') renderGroup();
  else if(state.currentPage === 'page-all-words') renderAllWords();
  else if(state.currentPage === 'page-add-to-lib') renderAddToLib();
  else if(state.currentPage === 'page-story-home') renderStoryHome();
  else if(state.currentPage === 'page-story-lib') renderStoryLib();
  else navigateHome();
}

/* ========== Init ========== */
function init(){
  state.libraries = loadLibraries();
  state.words = loadWords();
  state.storyLibs = loadStoryLibs();
  state.stories = loadStories();
  renderHome();
  showPage('page-home');
}
init();
</script>
